
AWSTemplateFormatVersion: '2010-09-09'
Description: Event-driven serverless file processing with S3, Lambda, VPC and SNS

Parameters:
  FileBucketName:
    Type: String
    Description: Globally unique lowercase S3 bucket name
    AllowedPattern: '^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$'
    ConstraintDescription: Use 3-63 lowercase letters, numbers, dots or hyphens.

  AlertEmail:
    Type: String
    Description: Email address for processing notifications
    AllowedPattern: '^[^@ ]+@[^@ ]+\.[^@ ]+$'
    ConstraintDescription: Enter a valid email address.

Resources:

  # 1. VPC and Networking
  FileProcessingVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: FileProcessingVPC

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachInternetGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref FileProcessingVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: FileProcessingPublicSubnet

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref FileProcessingVPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: FileProcessingPrivateSubnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachInternetGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  NatElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachInternetGateway
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicSubnetRouteAssociation
    Properties:
      AllocationId: !GetAtt NatElasticIP.AllocationId
      SubnetId: !Ref PublicSubnet
      ConnectivityType: public
      Tags:
        - Key: Name
          Value: FileProcessingNAT

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref FileProcessingVPC

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # Optional private access to S3
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref FileProcessingVPC
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound access for the processing Lambda
      VpcId: !Ref FileProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0

  # 2. SNS notifications
  FileProcessingTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: FileProcessingAlerts

  EmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref FileProcessingTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  # 3. Secure S3 storage
  FileBucket:
    Type: AWS::S3::Bucket
    DependsOn: AllowS3InvokeLambda
    Properties:
      BucketName: !Ref FileBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessFileFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/
      Tags:
        - Key: Name
          Value: FileProcessingBucket

  # 4. Lambda execution role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: FileProcessingPermissions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${FileBucketName}/*
              - Effect: Allow
                Action: sns:Publish
                Resource: !Ref FileProcessingTopic

  # 5. File-processing Lambda function
  ProcessFileFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: ProcessUploadedFile
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128
      VpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
      Environment:
        Variables:
          SNS_TOPIC_ARN: !Ref FileProcessingTopic
      Code:
        ZipFile: |
          import json
          import os
          import urllib.parse
          from datetime import datetime, timezone
          import boto3

          s3 = boto3.client("s3")
          sns = boto3.client("sns")

          def lambda_handler(event, context):
              results = []

              for record in event.get("Records", []):
                  bucket = record["s3"]["bucket"]["name"]
                  key = urllib.parse.unquote_plus(
                      record["s3"]["object"]["key"]
                  )

                  # Read uploaded object metadata
                  details = s3.head_object(Bucket=bucket, Key=key)

                  metadata = {
                      "source_bucket": bucket,
                      "source_key": key,
                      "size_bytes": details["ContentLength"],
                      "content_type": details.get(
                          "ContentType", "unknown"
                      ),
                      "processed_at": datetime.now(
                          timezone.utc
                      ).isoformat(),
                      "status": "SUCCESS"
                  }

                  # Save the processing log outside uploads/
                  log_key = f"processed/{key}.metadata.json"
                  s3.put_object(
                      Bucket=bucket,
                      Key=log_key,
                      Body=json.dumps(metadata, indent=2).encode("utf-8"),
                      ContentType="application/json"
                  )

                  message = (
                      f"File processed successfully.\n"
                      f"Bucket: {bucket}\n"
                      f"File: {key}\n"
                      f"Size: {details['ContentLength']} bytes\n"
                      f"Metadata log: {log_key}"
                  )

                  sns.publish(
                      TopicArn=os.environ["SNS_TOPIC_ARN"],
                      Subject="S3 File Processing Successful",
                      Message=message
                  )

                  results.append(metadata)

              return {
                  "statusCode": 200,
                  "body": json.dumps(results)
              }

  # Allow S3 to invoke Lambda for this bucket
  AllowS3InvokeLambda:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt ProcessFileFunction.Arn
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub arn:${AWS::Partition}:s3:::${FileBucketName}

Outputs:
  S3BucketName:
    Description: Upload test files to the uploads/ prefix
    Value: !Ref FileBucket

  LambdaFunctionName:
    Value: !Ref ProcessFileFunction

  SNSTopicArn:
    Value: !Ref FileProcessingTopic

  VPCId:
    Value: !Ref FileProcessingVPC

  PrivateSubnetId:
    Value: !Ref PrivateSubnet
